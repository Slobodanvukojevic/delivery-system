spring.config.import=optional:configserver:http://config-server:8888
server.port=8081
spring.application.name=delivery-service

spring.datasource.url=jdbc:mysql://mysql-delivery:3306/delivery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Belgrade
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

delivery.return-check-cron=0 */2 * * * *