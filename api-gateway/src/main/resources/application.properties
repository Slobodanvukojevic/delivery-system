server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Ruta 1: User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# Ruta 2: Delivery Service
spring.cloud.gateway.server.webmvc.routes[1].id=delivery-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://delivery-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**,/api/locations/**,/api/lockers/**,/api/branches/**

# Ruta 3: Payment Service
spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/payments/**

# Ruta 4: Notification Service
spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**

# Ruta 5: Report Service
spring.cloud.gateway.server.webmvc.routes[4].id=report-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://report-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/reports/**