<div class="container mt-4">
    <h2 class="mb-4">Kuriri</h2>

    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Poslovnica (ID)</label>
                <input
                    type="number"
                    class="form-control"
                    placeholder="npr. 1"
                    [(ngModel)]="odabraniBranchId"
                    (input)="filtriraj()"
                />
            </div>
        </div>
    </div>

    <div class="card">
        <table class="table table-striped mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ime</th>
                    <th>Email</th>
                    <th>Telefon</th>
                    <th>Poslovnica</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                @for (c of prikazani; track c.id) {
                    <tr>
                        <td>{{ c.id }}</td>
                        <td>{{ c.fullName }}</td>
                        <td>{{ c.email }}</td>
                        <td>{{ c.phone }}</td>
                        <td>{{ c.branchId || '-' }}</td>
                        <td>
                            @if (c.active) {
                                <span class="badge bg-success">Aktivan</span>
                            } @else {
                                <span class="badge bg-secondary">Neaktivan</span>
                            }
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            Nema kurira.
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
