<div class="card p-3 mb-2" [appHighlight]="statusBoja()">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h6 class="mb-1">Porudzbina #{{ order.id }}</h6>
            <p class="mb-1">Primalac: <strong>{{ order.customerName }}</strong></p>
            <p class="mb-0 text-muted">{{ order.status | orderStatus }} | {{ order.deliveryMethod | deliveryMethod }} | {{ order.price | currencyRsd }}</p>
        </div>
        <button class="btn btn-sm btn-primary" (click)="prikaziDetalje()">
            Detalji
        </button>
    </div>
</div>
